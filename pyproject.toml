[project]
name = "biblioteca-especialistas"
version = "0.1.0"
description = "Buscador extrativo: quem disse o quê, e onde."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "yt-dlp>=2025.1.1",
  "youtube-transcript-api>=1.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",
  "faster-whisper>=1.1",
  "pyannote.audio>=4.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
biblioteca = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: testes que precisam do Postgres rodando (docker compose up -d)"]
