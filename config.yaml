database_url: postgresql://biblioteca:biblioteca@localhost:5442/biblioteca

modelos:
  device: auto            # auto | mps | cuda | cpu
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  whisper: turbo          # faster-whisper roda em CPU int8 no Mac (sem CUDA)
  diarizacao: pyannote/speaker-diarization-community-1

api:
  host: 127.0.0.1
  port: 8000

dados_dir: data           # áudio baixado (fora do git)

transcricao:
  idiomas: [pt, pt-BR]
  preferir: legenda_youtube   # legenda_youtube | whisper (Whisper também é o fallback sem legenda)

atribuicao:
  limiar_voz: 0.6         # similaridade de cosseno mínima com amostra_voz; calibrar

chunk:
  duracao_min_s: 45
  duracao_max_s: 60
  sobreposicao_s: 10
  max_interrupcao_s: 5    # interjeição do outro falante até isso não quebra o trecho

busca:
  candidatos: 50          # saída da busca híbrida
  rrf_k: 60
  top_reranker: 10
  limiar_reranker: 0.3  # calibrado por eval/rodar.py
  limiar_relacionados: 0.2  # sem resposta direta, trechos acima disso aparecem como "relacionados"
  max_relacionados: 3
